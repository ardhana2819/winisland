# ci.yml: checks every pull request into main.
# Runs the same format, build, and test steps you run locally, on a clean Windows machine.
# Kept lean on purpose: Windows runners on private repos use Actions minutes at 2x the Linux rate.

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same pull request cancels the older, now outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore packages
        run: dotnet restore WinIsland.slnx

      - name: Check formatting
        run: dotnet format WinIsland.slnx --verify-no-changes --no-restore

      - name: Build (Release, warnings are errors)
        run: dotnet build WinIsland.slnx -c Release --no-restore -warnaserror

      - name: Run tests
        run: dotnet test WinIsland.slnx -c Release --no-build
