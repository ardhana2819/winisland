# release.yml: builds a downloadable WinIsland when a version tag like v1.0.0 is pushed.
# Publishes a self-contained win-x64 build (no .NET install needed on the target PC),
# zips it, and attaches it to a GitHub Release with notes generated from merged pull requests.
# The zip also holds the packaging scripts (Start menu shortcut, optional instant notifications),
# but never packaging/out, certificates or keys. No certificates or secrets are used here; package
# identity is set up on the target PC (see packaging/README.md).

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      VERSION_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run tests before releasing
        run: dotnet test WinIsland.slnx -c Release

      - name: Publish self-contained win-x64 build
        run: >
          dotnet publish src/WinIsland.App/WinIsland.App.csproj
          -c Release -r win-x64 --self-contained true
          -o "publish/WinIsland-$env:VERSION_TAG-win-x64"

      - name: Add the packaging scripts
        shell: pwsh
        run: |
          $target = "publish/WinIsland-$env:VERSION_TAG-win-x64/packaging"
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item packaging/*.ps1, packaging/*.xml, packaging/README.md $target

      - name: Zip the build
        shell: pwsh
        run: >
          Compress-Archive
          -Path "publish/WinIsland-$env:VERSION_TAG-win-x64/*"
          -DestinationPath "publish/WinIsland-$env:VERSION_TAG-win-x64.zip"

      - name: Create GitHub Release with notes from merged pull requests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:VERSION_TAG
          "publish/WinIsland-$env:VERSION_TAG-win-x64.zip"
          --title "WinIsland $env:VERSION_TAG"
          --generate-notes
