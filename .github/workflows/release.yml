# release.yml: builds a downloadable WinIsland when a version tag like v1.0.0-beta.1 is pushed.
# A tag with a "-" part (for example -beta.1) is published as a GitHub pre-release.
# Publishes a self-contained win-x64 build (no .NET install needed on the target PC),
# zips it, builds the installer (PRD FR-44, Inno Setup, already on GitHub's Windows machines), and
# attaches both to a GitHub Release with notes generated from merged pull requests.
# The build also holds the packaging scripts (Start menu shortcut, optional instant notifications),
# but never packaging/out, certificates or keys. No certificates or secrets are used here: the
# installer is not signed, and package identity is set up on the target PC (packaging/README.md).

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      VERSION_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run tests before releasing
        run: dotnet test WinIsland.slnx -c Release

      - name: Publish self-contained win-x64 build with the packaging scripts
        shell: pwsh
        run: ./packaging/Publish-WinIsland.ps1 -Version $env:VERSION_TAG -OutputFolder publish

      - name: Zip the build
        shell: pwsh
        run: >
          Compress-Archive
          -Path "publish/WinIsland-$env:VERSION_TAG-win-x64/*"
          -DestinationPath "publish/WinIsland-$env:VERSION_TAG-win-x64.zip"

      - name: Build the installer
        shell: pwsh
        run: >
          ./packaging/Build-Installer.ps1 -Version $env:VERSION_TAG
          -SourceFolder "publish/WinIsland-$env:VERSION_TAG-win-x64"
          -OutputFolder publish

      - name: Create GitHub Release with notes from merged pull requests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseArguments = @(
            $env:VERSION_TAG,
            "publish/WinIsland-$env:VERSION_TAG-win-x64.zip",
            "publish/WinIsland-$env:VERSION_TAG-setup.exe",
            "--title", "WinIsland $env:VERSION_TAG",
            "--generate-notes"
          )
          if ($env:VERSION_TAG.Contains("-")) {
            $releaseArguments += "--prerelease"
          }
          gh release create @releaseArguments
